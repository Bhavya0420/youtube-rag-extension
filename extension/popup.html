<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <title>YouTube RAG Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            width: 380px;
            margin: 0;
            padding: 18px;
            font-family: Arial, sans-serif;
            background: #f5f6fb;
            color: #1f2937;
        }

        .header {
            margin-bottom: 16px;
        }

        .header h2 {
            margin: 0;
            font-size: 21px;
        }

        .header p {
            margin: 5px 0 0;
            color: #6b7280;
            font-size: 13px;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        button {
            width: 100%;
            border: 1px solid #4338ca;
            border-radius: 12px;
            padding: 11px;
            margin-top: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: #4f46e5;
            color: white;
        }

        button:hover {
            background: #4338ca;
        }

        #loadVideo {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin-top: 15px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        #status {
            margin: 10px 0 0;
            font-size: 13px;
            color: #16a34a;
        }

        .answer-title {
            margin-top: 20px;
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: 700;
        }

        #answer {
            background: #f8f9fc;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 13px;
            margin: 0;
            line-height: 1.6;
            font-size: 14px;
            color: #374151;
            min-height: 45px;
        }

        .footer {
            text-align: center;
            margin-top: 13px;
            font-size: 11px;
            color: #9ca3af;
        }
    </style>
</head>

<body>

    <div class="header">
        <h2>🎥 YouTube RAG Assistant</h2>
        <p>Ask questions about any YouTube video</p>
    </div>

    <div class="card">

        <button id="loadVideo">
            📺 Load Current Video
        </button>

        <p id="status"></p>

        <input
            type="text"
            id="question"
            placeholder="Ask something about the video..."
        >

        <button id="ask">
            ✨ Ask Question
        </button>

        <div class="answer-title">
            💡 Answer
        </div>

        <p id="answer">
            Load a video and ask a question to get started.
        </p>

    </div>

    <div class="footer">
        Powered by LangChain + RAG
    </div>

    <script src="popup.js"></script>

</body>

</html>
